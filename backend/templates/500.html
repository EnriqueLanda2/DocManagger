<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 – Error del servidor | DocManager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      pointer-events: none;
    }
    .blob-1 { width: 500px; height: 500px; background: #6366f1; top: -150px; left: -150px; animation: float 9s ease-in-out infinite; }
    .blob-2 { width: 400px; height: 400px; background: #3b82f6; bottom: -100px; right: -100px; animation: float 9s ease-in-out infinite; animation-delay: -4s; }
    .blob-3 { width: 300px; height: 300px; background: #8b5cf6; top: 40%; left: 60%; animation: float 9s ease-in-out infinite; animation-delay: -6s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-25px) scale(1.04); }
    }

    .card {
      position: relative;
      z-index: 10;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 1.5rem;
      padding: 3rem 3.5rem;
      text-align: center;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      animation: cardIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: scale(0.85) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    .logo-icon {
      width: 2.5rem;
      height: 2.5rem;
      background: #fff;
      border-radius: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-icon svg { width: 1.5rem; height: 1.5rem; color: #0f172a; }
    .logo-name { font-size: 1.25rem; font-weight: 700; color: #fff; letter-spacing: -0.02em; }

    .error-number {
      font-size: 7rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.65; }
    }

    h1 { font-size: 1.5rem; font-weight: 700; color: #f1f5f9; margin-bottom: 0.75rem; }

    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      border-radius: 0.75rem;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: all 0.2s ease;
      margin: 0.25rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      color: #fff;
      box-shadow: 0 4px 15px rgba(99,102,241,0.35);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(99,102,241,0.45); }

    .btn-secondary {
      background: rgba(51, 65, 85, 0.8);
      color: #94a3b8;
      border: 1px solid rgba(148,163,184,0.2);
    }
    .btn-secondary:hover { background: rgba(71, 85, 105, 0.8); color: #e2e8f0; transform: translateY(-2px); }

    .divider {
      width: 3rem;
      height: 3px;
      background: linear-gradient(90deg, #6366f1, #3b82f6);
      border-radius: 2px;
      margin: 0 auto 1.5rem;
    }

    .error-code {
      display: inline-block;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #475569;
      font-family: monospace;
      background: rgba(15,23,42,0.5);
      padding: 0.35rem 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(255,255,255,0.05);
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="card">
    <div class="logo-row">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
          <line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/>
        </svg>
      </div>
      <span class="logo-name">DocManager</span>
    </div>

    <div class="error-number">500</div>
    <div class="divider"></div>
    <h1>Error interno del servidor</h1>
    <p>Algo salió mal en el servidor.<br>El equipo técnico ya fue notificado. Intenta de nuevo en unos momentos.</p>
    <div>
      <a href="/docM/" class="btn btn-primary">Volver al inicio</a>
      <a href="mailto:soporte@koodisoft.com" class="btn btn-secondary">Contactar soporte</a>
    </div>
    <span class="error-code">HTTP 500 — Internal Server Error</span>
  </div>
</body>
</html>
