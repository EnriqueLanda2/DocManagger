sonar.projectKey=doc-platform-frontend
sonar.projectName=doc-platform-frontend
sonar.projectVersion=1.0

sonar.sources=src
sonar.sourceEncoding=UTF-8

sonar.inclusions=**/*.js,**/*.jsx,**/*.ts,**/*.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.*,**/*.spec.*

sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.test.ts,**/*.test.tsx,**/*.spec.*

sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.coverage.exclusions=src/main.jsx,src/App.jsx,src/components/SplashScreen.jsx,src/components/Loader.jsx,src/components/Notification.jsx,src/components/PermissionsModal.jsx,src/components/CreateDocumentModal.jsx,src/components/ShareModal.jsx,src/pages/LandingPage.jsx,src/pages/PublicViewer.jsx,src/pages/CompareView.jsx
