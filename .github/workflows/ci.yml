name: CI - Tests, Linting y Seguridad

on:
  pull_request:
    branches: [master, produccion]
  push:
    branches: [master, produccion]

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: doc_platform_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY_CI }}
      FERNET_KEY: ${{ secrets.FERNET_KEY_CI }}
      DJANGO_SETTINGS_MODULE: doc_platform.settings
      DEBUG: 'False'
      DB_NAME: doc_platform_test
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Instalar herramientas de análisis
        run: pip install safety pytest pytest-django pytest-cov

      - name: Auditoría de seguridad de dependencias
        working-directory: backend
        run: safety check -r requirements.txt --continue-on-error

      - name: Ejecutar migraciones
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Ejecutar tests con cobertura
        working-directory: backend
        run: pytest core/tests.py -v --cov=core --cov-report=xml --cov-report=term-missing

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

      - name: Análisis SonarQube (Backend)
        uses: SonarSource/sonarqube-scan-action@master
        with:
          projectBaseDir: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Linting ESLint
        working-directory: frontend
        run: npm run lint

      - name: Auditoría de seguridad npm
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build de verificación
        working-directory: frontend
        run: npm run build

      - name: Ejecutar tests con cobertura
        working-directory: frontend
        run: npm run test:coverage

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info

      - name: Análisis SonarQube (Frontend)
        uses: SonarSource/sonarqube-scan-action@master
        with:
          projectBaseDir: frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONTEND }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
